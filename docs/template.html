<!DOCTYPE html>

<body>

        <nav id="sections">
            {{SIDEBAR}}
        </nav>
        <main id="documentation" aria-live="polite">
            {{CONTENT}}
        </main>
    </div>
    <script type="module" src="/js/docs.min.js"></script>

</html>
